<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C4 Radio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #07080C; background-image: radial-gradient(ellipse 900px 600px at 960px 500px, #16202F 0%, #07080C 75%); color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif">
  

  <div style="position: absolute; left: 0; top: 230px; width: 1920px; height: 460px; display: flex; align-items: center; justify-content: center; gap: 40px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <div style="width: {{c.w}}; height: {{c.h}}; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: {{c.o}}; box-shadow: {{c.shadow}}; flex-shrink: 0">
        <img src="{{c.logo}}" alt="" style="width: 88%; height: 88%; object-fit: contain">
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; top: 730px; width: 1920px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; letter-spacing: 2px; color: #F0262B"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F0262B"></span>LIVE RADIO · MUSIC</div>
    <h1 style="margin: 0; font-weight: 800; font-size: 64px; letter-spacing: -1px">3ABN Music Channel</h1>
    <div style="display: flex; gap: 16px; margin-top: 10px">
      <div style="height: 70px; padding: 0 40px; border-radius: 35px; background: #FFFFFF; color: #07080C; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 25px">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z" fill="#07080C"/></svg>Listen</div>
    </div>
    <div style="font-weight: 600; font-size: 21px; color: #A6ABB8; margin-top: 10px">Left / Right for the other 9 stations</div>
  </div>
<div style="position: absolute; left: 0; top: 0; width: 220px; height: 1080px; background: linear-gradient(90deg, rgba(7,8,12,0.7), rgba(7,8,12,0))"></div>
  <img src="/_blob/ec7c10bad0117787e03b001592d65bba" alt="mySDAtv" style="position: absolute; left: 12px; top: 40px; width: 144px; height: 75px">
  <div style="position: absolute; left: 184px; top: 46px; display: flex; align-items: baseline; gap: 18px"><span style="font-weight: 800; font-size: 46px; letter-spacing: -0.5px">Radio</span><span style="font-weight: 600; font-size: 24px; color: #A6ABB8">10 stations</span></div>
  <div style="position: absolute; left: 32px; top: 250px; width: 104px; padding: 16px; box-sizing: border-box; border-radius: 52px; background: rgba(24,26,34,0.82); box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 12px">
      <div style="width: 72px; height: 72px; border-radius: 36px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="#A6ABB8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19L20 7l14 12M10 16v17h20V16M17 33v-9h6v9"/></svg></div>
      <div style="width: 72px; height: 72px; border-radius: 36px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="#A6ABB8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 12h23a3.5 3.5 0 0 1 3.5 3.5v13a3.5 3.5 0 0 1-3.5 3.5h-23A3.5 3.5 0 0 1 5 28.5v-13A3.5 3.5 0 0 1 8.5 12zM14 36h12M15 5l5 6 5-6"/></svg></div>
      <div style="width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 14h25a3.5 3.5 0 0 1 3.5 3.5v14a3.5 3.5 0 0 1-3.5 3.5h-25A3.5 3.5 0 0 1 4 31.5v-14A3.5 3.5 0 0 1 7.5 14zM20 24.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zM25 21h6M25 27.5h6M9 14l21-9"/></svg></div>
      <div style="width: 72px; height: 72px; border-radius: 36px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="#A6ABB8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13a14 14 0 1 1-2 9M4.5 8l2.1 7.3 7-2.3M20 12v8l6 3.5"/></svg></div>
      <div style="width: 72px; height: 72px; border-radius: 36px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="#A6ABB8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M26.5 12.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0zM7 34c0-7.5 5.5-11.5 13-11.5S33 26.5 33 34"/></svg></div>
  </div>
  <div style="position: absolute; right: 96px; top: 56px; font-weight: 600; font-size: 27px; color: #A6ABB8">3:20 PM</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (logo, size) => {
      const s = { far: [254, 180, 0.35], near: [380, 270, 0.6], focus: [600, 426, 1] }[size];
      return { logo: '/_blob/' + logo, w: s[0] + 'px', h: s[1] + 'px', o: s[2], shadow: size === 'focus' ? '0 40px 100px rgba(0,0,0,0.8)' : 'none' };
    };
    return {
      menu: [
        { label: 'Home', w: 600, c: '#A6ABB8' }, { label: 'Channels', w: 600, c: '#A6ABB8' }, { label: 'Radio', w: 800, c: '#FFFFFF' },
        { label: 'Catch-up', w: 600, c: '#A6ABB8' }, { label: 'Account', w: 600, c: '#A6ABB8' }
      ],
      cards: [
        c('c72a58266bbb3eeb731eaa768070d32a', 'far'), c('2888c735f196e4ced270258e4bd0be07', 'near'),
        c('dfe63e8c017361de0001a951b2020d2e', 'focus'),
        c('7a52b253fa820b19ca2052f34366480f', 'near'), c('c3213fdf92f289d37c4272c832a8e8dd', 'far')
      ]
    };
  }
}
</script>
</body>
</html>
