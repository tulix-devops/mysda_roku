<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A3 Radios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B1222; background-image: radial-gradient(ellipse 1500px 900px at 230px -60px, #1F2A44 0%, #141C30 45%, #0B1222 100%); color: #FFFFFF; font-family: Inter, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 120px; height: 1080px">
    <img src="/_blob/626310db1af1e2cf0f2088632ef8c777" alt="" style="position: absolute; left: 30px; top: 36px; width: 60px; height: 60px">
    <div style="position: absolute; left: 40px; top: 186px; display: flex; flex-direction: column; gap: 30px">
      <sc-for list="{{icons}}" as="i" hint-placeholder-count="5">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="{{i.color}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-top: {{i.gap}}"><path d="{{i.d}}"/></svg>
      </sc-for>
    </div>
  </div>

  <img src="/_blob/ec7c10bad0117787e03b001592d65bba" alt="mySDAtv" style="position: absolute; left: 160px; top: 30px; width: 207px; height: 108px">
  <h1 style="position: absolute; left: 160px; top: 150px; margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 54px; line-height: 66px">Radios</h1>
  <div style="position: absolute; left: 420px; top: 168px; font-size: 24px; color: #B4BCCB; line-height: 36px">10 stations, live around the clock</div>
  <div style="position: absolute; right: 60px; top: 48px; width: 420px; height: 60px; border-radius: 12px; background: #151E33; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box">
    <span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 30px">3:20 PM</span>
    <span style="font-size: 21px; color: #B4BCCB">Sunday, Oct 5</span>
  </div>

  <div style="position: absolute; left: 160px; top: 270px; width: 1700px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 46px 20px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="height: 230px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; transform: scale({{t.scale}}); transform-origin: bottom left; box-shadow: {{t.glow}}; opacity: {{t.dim}}">
          <img src="{{t.logo}}" alt="" style="width: 290px; height: 206px; object-fit: contain">
        </div>
        <div style="font-weight: 600; font-size: 27px; color: {{t.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</div>
        <div style="display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 22px; color: #B4BCCB">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="#F0262B"><rect x="2" y="8" width="3" height="10" rx="1.5"/><rect x="7.5" y="3" width="3" height="15" rx="1.5"/><rect x="13" y="6" width="3" height="12" rx="1.5"/><rect x="18.5" y="10" width="3" height="8" rx="1.5"/></svg>
          {{t.meta}}
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const d = {
      tv: 'M8.5 12h23a3.5 3.5 0 0 1 3.5 3.5v13a3.5 3.5 0 0 1-3.5 3.5h-23A3.5 3.5 0 0 1 5 28.5v-13A3.5 3.5 0 0 1 8.5 12zM14 36h12M15 5l5 6 5-6',
      globe: 'M35 20a15 15 0 1 1-30 0 15 15 0 0 1 30 0zM27 20c0 8.3-3.1 15-7 15s-7-6.7-7-15 3.1-15 7-15 7 6.7 7 15zM5 20h30M8 12.5h24M8 27.5h24',
      dvr: 'M8 13a14 14 0 1 1-2 9M4.5 8l2.1 7.3 7-2.3M20 12v8l6 3.5',
      radio: 'M7.5 14h25a3.5 3.5 0 0 1 3.5 3.5v14a3.5 3.5 0 0 1-3.5 3.5h-25A3.5 3.5 0 0 1 4 31.5v-14A3.5 3.5 0 0 1 7.5 14zM20 24.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zM25 21h6M25 27.5h6M9 14l21-9',
      user: 'M26.5 12.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0zM7 34c0-7.5 5.5-11.5 13-11.5S33 26.5 33 34'
    };
    const rest = { scale: 0.92, glow: 'none', dim: 0.84, titleColor: '#FFFFFF' };
    const lit = { scale: 1, glow: '0 0 0 3px rgba(240,38,43,0.35), 0 0 46px 6px rgba(240,38,43,0.45)', dim: 1, titleColor: '#F0262B' };
    const t = (logo, title, meta, f) => Object.assign({ logo: '/_blob/' + logo, title, meta }, f ? lit : rest);
    return {
      icons: [
        { d: d.tv, color: '#C4CAD6', gap: '0px' }, { d: d.globe, color: '#C4CAD6', gap: '0px' }, { d: d.dvr, color: '#C4CAD6', gap: '0px' },
        { d: d.radio, color: '#FAD35A', gap: '0px' }, { d: d.user, color: '#C4CAD6', gap: '56px' }
      ],
      tiles: [
        t('2888c735f196e4ced270258e4bd0be07', '3ABN Radio', 'Live radio · English', true),
        t('dfe63e8c017361de0001a951b2020d2e', '3ABN Music Channel', 'Live radio · Music'),
        t('7a52b253fa820b19ca2052f34366480f', '3ABN Australia Radio', 'Live radio · English'),
        t('c3213fdf92f289d37c4272c832a8e8dd', '3ABN Latino Radio', 'Live radio · Español'),
        t('5208d441840f2b0e53a315bbda40e0db', 'Novo Tempo Radio', 'Live radio · Português'),
        t('c72a58266bbb3eeb731eaa768070d32a', 'Radio 74', 'Live radio')
      ]
    };
  }
}
</script>
</body>
</html>
