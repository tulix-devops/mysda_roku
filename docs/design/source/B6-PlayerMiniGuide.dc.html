<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B6 Player mini guide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: Barlow, sans-serif">
  <img src="/_blob/0ac5dbae153d93324008faeb65c388ea" alt="" style="position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; filter: blur(6px); transform: scale(1.03)">
  <div style="position: absolute; left: 0; bottom: 0; width: 1920px; height: 620px; background: linear-gradient(0deg, rgba(5,11,30,0.97) 0%, rgba(5,11,30,0.9) 60%, rgba(5,11,30,0) 100%)"></div>

  <div style="position: absolute; left: 64px; top: 520px; display: flex; align-items: center; gap: 14px">
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#A9B6CF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24l10-10 10 10"/></svg>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: #A9B6CF">UP / DOWN TO BROWSE · OK TO SWITCH · RIGHT FOR LATER</span>
  </div>

  <div style="position: absolute; left: 64px; top: 576px; width: 1792px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; color: #A9B6CF; padding-left: 420px">
      <div style="width: 770px">NOW</div><div>NEXT</div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="height: 118px; display: flex; gap: 8px; opacity: {{r.o}}">
        <div style="width: 412px; border-radius: 8px; background: {{r.chBg}}; color: {{r.chFg}}; display: flex; align-items: center; gap: 16px; padding: 0 14px; box-sizing: border-box">
          <div style="width: 124px; height: 88px; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="{{r.logo}}" alt="" style="width: 114px; height: 81px; object-fit: contain"></div>
          <div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 27px">{{r.name}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; opacity: 0.75">{{r.ch}}</span></div>
        </div>
        <div style="width: 770px; border-radius: 8px; background: {{r.nowBg}}; color: {{r.nowFg}}; padding: 14px 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 8px">
          <span style="font-weight: 700; font-size: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.now}}</span>
          <div style="display: flex; align-items: center; gap: 14px; font-size: 20px; opacity: 0.85"><span>{{r.nowTime}}</span><div style="width: 300px; height: 5px; border-radius: 3px; background: {{r.track}}"><div style="width: {{r.pct}}; height: 5px; border-radius: 3px; background: {{r.fill}}"></div></div></div>
        </div>
        <div style="flex-grow: 1; border-radius: 8px; background: #10203F; padding: 14px 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 6px">
          <span style="font-weight: 700; font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.next}}</span>
          <span style="font-size: 20px; color: #A9B6CF">{{r.nextTime}}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; right: 64px; top: 48px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px">3:20 PM</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (logo, name, ch, now, nowTime, pct, next, nextTime, focus) => ({
      logo: '/_blob/' + logo, name, ch, now, nowTime, pct, next, nextTime, o: focus ? 1 : 0.86,
      chBg: focus ? '#FAD35A' : '#0B1733', chFg: focus ? '#050B1E' : '#FFFFFF',
      nowBg: focus ? '#16294F' : '#10203F', nowFg: '#FFFFFF', track: '#1C2E55', fill: focus ? '#FAD35A' : '#A9B6CF'
    });
    return {
      rows: [
        r('242bd1a56c08d0855ef8ca15fcbcd4ef', '3ABN', 'CH 1', '3ABN TODAY BIBLE Q&A', '3:00 – 3:55 PM', '36%', '3ABN KIDS CAMP KITCHEN FUN', '4:00 – 4:28 PM'),
        r('e40d84f762578caed15688344a03391c', '3ABN Proclaim', 'CH 2 · WATCHING', 'REVELATION OF JESUS CHRIST', '3:00 – 3:57 PM', '35%', 'WHITE HORSE MEDIA', '4:00 – 4:28 PM', true),
        r('3cd27ca3e7d58e9a1aa8273e9c19caa4', '3ABN Kids Network', 'CH 5', 'TINY TOTS WORSHIP', '3:15 – 3:29 PM', '36%', 'TINY TOTS FOR JESUS', '3:30 – 3:58 PM')
      ]
    };
  }
}
</script>
</body>
</html>
