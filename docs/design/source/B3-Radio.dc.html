<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B3 Radio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #050B1E; color: #FFFFFF; font-family: Barlow, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 1920px; height: 104px; display: flex; align-items: center; padding: 0 64px; box-sizing: border-box; gap: 56px; border-bottom: 1px solid #1C2E55">
    <img src="/_blob/ec7c10bad0117787e03b001592d65bba" alt="mySDAtv" style="width: 150px; height: 78px">
    <div style="display: flex; gap: 44px; flex-grow: 1">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 1px; color: {{t.fg}}; padding: 8px 0; border-bottom: 4px solid {{t.line}}">{{t.label}}</div>
      </sc-for>
    </div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px">3:20 PM <span style="color: #A9B6CF; font-weight: 600">SUN OCT 5</span></div>
  </div>

  <div style="position: absolute; left: 64px; top: 140px; width: 760px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{stations}}" as="s" hint-placeholder-count="8">
      <div style="height: 98px; border-radius: 8px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; gap: 20px; padding: 0 12px; box-sizing: border-box">
        <div style="width: 110px; height: 78px; border-radius: 6px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="{{s.logo}}" alt="" style="width: 100px; height: 71px; object-fit: contain"></div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-weight: 700; font-size: 28px">{{s.name}}</span><span style="font-weight: 600; font-size: 20px; opacity: 0.75">{{s.lang}}</span></div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: {{s.liveFg}}; padding-right: 10px">{{s.state}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 888px; top: 140px; width: 968px; height: 880px; border-radius: 16px; background: #0B1733; display: flex; flex-direction: column; align-items: center; gap: 30px; padding-top: 70px; box-sizing: border-box">
    <div style="width: 560px; height: 398px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><img src="/_blob/c3213fdf92f289d37c4272c832a8e8dd" alt="3ABN Latino Radio" style="width: 520px; height: 370px; object-fit: contain"></div>
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="height: 38px; padding: 0 14px; border-radius: 7px; background: #F0262B; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 21px"><span style="width: 9px; height: 9px; border-radius: 5px; background: #FFFFFF"></span>ON AIR</div>
      <span style="font-weight: 700; font-size: 22px; color: #FAD35A">ESPAÑOL</span>
    </div>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 72px; line-height: 1">3ABN LATINO RADIO</h1>
    <div style="display: flex; align-items: flex-end; gap: 7px; height: 56px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="20">
        <div style="width: 10px; border-radius: 5px; background: #FAD35A; height: {{b}}"></div>
      </sc-for>
    </div>
    <div style="font-size: 24px; color: #A9B6CF">OK to listen · keeps playing while you browse the guide</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (logo, name, lang, state) => ({
      logo: '/_blob/' + logo, name, lang,
      bg: state === 'focus' ? '#FAD35A' : '#0B1733', fg: state === 'focus' ? '#050B1E' : '#FFFFFF',
      state: state === 'playing' ? '● PLAYING' : (state === 'focus' ? 'OK TO LISTEN' : ''), liveFg: state === 'playing' ? '#F0262B' : '#050B1E'
    });
    return {
      tabs: [
        { label: 'GUIDE', fg: '#A9B6CF', line: 'transparent' }, { label: 'LANGUAGES', fg: '#A9B6CF', line: 'transparent' },
        { label: 'RADIO', fg: '#FFFFFF', line: '#FAD35A' }, { label: 'CATCH-UP', fg: '#A9B6CF', line: 'transparent' },
        { label: 'ACCOUNT', fg: '#A9B6CF', line: 'transparent' }
      ],
      stations: [
        st('2888c735f196e4ced270258e4bd0be07', '3ABN Radio', 'English', 'playing'),
        st('dfe63e8c017361de0001a951b2020d2e', '3ABN Music Channel', 'Music'),
        st('7a52b253fa820b19ca2052f34366480f', '3ABN Australia Radio', 'English'),
        st('c3213fdf92f289d37c4272c832a8e8dd', '3ABN Latino Radio', 'Español', 'focus'),
        st('5208d441840f2b0e53a315bbda40e0db', 'Novo Tempo Radio', 'Português'),
        st('c72a58266bbb3eeb731eaa768070d32a', 'Radio 74', 'Live radio')
      ],
      bars: ['22px', '40px', '54px', '30px', '48px', '56px', '26px', '44px', '36px', '52px', '20px', '46px', '34px', '56px', '28px', '42px', '50px', '24px', '38px', '30px']
    };
  }
}
</script>
</body>
</html>
