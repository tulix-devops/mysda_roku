<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A2 TV Languages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B1222; background-image: radial-gradient(ellipse 1500px 900px at 230px -60px, #1F2A44 0%, #141C30 45%, #0B1222 100%); color: #FFFFFF; font-family: Inter, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 440px; height: 1080px; border-right: 1px solid #27324E; box-sizing: border-box">
    <img src="/_blob/626310db1af1e2cf0f2088632ef8c777" alt="" style="position: absolute; left: 30px; top: 36px; width: 60px; height: 60px">
    <div style="position: absolute; left: 108px; top: 42px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 36px; line-height: 48px"><span style="color: #F0262B">my</span><span style="color: #FAD35A">SDA</span><span style="color: #0981FB">tv</span></div>
    <div style="position: absolute; left: 24px; top: 176px; width: 392px; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{rail}}" as="r" hint-placeholder-count="5">
        <div style="height: 66px; border-radius: 12px; background: {{r.bg}}; display: flex; align-items: center; gap: 18px; padding: 0 16px; margin-top: {{r.gap}}; color: {{r.fg}}; font-weight: {{r.weight}}; font-size: 29px">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"/></svg>
          {{r.label}}
        </div>
      </sc-for>
    </div>
  </div>

  <img src="/_blob/ec7c10bad0117787e03b001592d65bba" alt="mySDAtv" style="position: absolute; left: 480px; top: 30px; width: 207px; height: 108px">
  <h1 style="position: absolute; left: 480px; top: 150px; margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 54px; line-height: 66px">Television Languages</h1>
  <div style="position: absolute; right: 60px; top: 48px; width: 420px; height: 60px; border-radius: 12px; background: #151E33; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box">
    <span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 30px">3:20 PM</span>
    <span style="font-size: 21px; color: #B4BCCB">Sunday, Oct 5</span>
  </div>

  <div style="position: absolute; left: 480px; top: 240px; display: flex; gap: 12px; white-space: nowrap">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="10">
      <div style="height: 48px; padding: 0 22px; border-radius: 24px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 22px; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}<span style="font-weight: 500; opacity: 0.7">{{c.n}}</span></div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 480px; top: 330px; width: 1700px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 46px 20px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
      <div style="display: flex; flex-direction: column; gap: 12px; opacity: 0.84">
        <div style="height: 230px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; transform: scale(0.92); transform-origin: bottom left">
          <img src="{{t.logo}}" alt="" style="width: 290px; height: 206px; object-fit: contain">
        </div>
        <div style="font-weight: 600; font-size: 27px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</div>
        <div style="display: flex; gap: 10px; align-items: center; font-weight: 500; font-size: 22px; color: #B4BCCB; white-space: nowrap">
          <span style="padding: 2px 10px; border-radius: 8px; background: #212C47; color: #FAD35A; font-weight: 600; font-size: 19px">{{t.lang}}</span>
          <span>Live now</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const icons = {
      tv: 'M8.5 12h23a3.5 3.5 0 0 1 3.5 3.5v13a3.5 3.5 0 0 1-3.5 3.5h-23A3.5 3.5 0 0 1 5 28.5v-13A3.5 3.5 0 0 1 8.5 12zM14 36h12M15 5l5 6 5-6',
      globe: 'M35 20a15 15 0 1 1-30 0 15 15 0 0 1 30 0zM27 20c0 8.3-3.1 15-7 15s-7-6.7-7-15 3.1-15 7-15 7 6.7 7 15zM5 20h30M8 12.5h24M8 27.5h24',
      dvr: 'M8 13a14 14 0 1 1-2 9M4.5 8l2.1 7.3 7-2.3M20 12v8l6 3.5',
      radio: 'M7.5 14h25a3.5 3.5 0 0 1 3.5 3.5v14a3.5 3.5 0 0 1-3.5 3.5h-25A3.5 3.5 0 0 1 4 31.5v-14A3.5 3.5 0 0 1 7.5 14zM20 24.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zM25 21h6M25 27.5h6M9 14l21-9',
      user: 'M26.5 12.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0zM7 34c0-7.5 5.5-11.5 13-11.5S33 26.5 33 34'
    };
    const row = (label, icon, focused, gap) => ({ label, icon: icons[icon], gap: gap || '0px',
      bg: focused ? '#F0262B' : 'transparent', fg: '#FFFFFF', weight: focused ? 700 : 600 });
    const tile = (logo, title, lang) => ({ logo: '/_blob/' + logo, title, lang });
    return {
      rail: [row('Television', 'tv'), row('TV Languages', 'globe', true), row('DVR', 'dvr'), row('Radios', 'radio'), row('Login', 'user', false, '56px')],
      chips: [
        { label: 'All', n: '16', bg: '#FAD35A', fg: '#0B1222' },
        { label: 'Português', n: '3', bg: '#212C47', fg: '#FFFFFF' },
        { label: 'Español', n: '6', bg: '#212C47', fg: '#FFFFFF' },
        { label: 'Français', n: '1', bg: '#212C47', fg: '#FFFFFF' },
        { label: 'Русский', n: '1', bg: '#212C47', fg: '#FFFFFF' },
        { label: 'العربية', n: '1', bg: '#212C47', fg: '#FFFFFF' },
        { label: '한국어', n: '1', bg: '#212C47', fg: '#FFFFFF' },
        { label: '中文', n: '1', bg: '#212C47', fg: '#FFFFFF' },
        { label: 'South Asian', n: '1', bg: '#212C47', fg: '#FFFFFF' }
      ],
      tiles: [
        tile('65b299a9290c54c570d3ed32566fc0d7', 'Novo Tempo', 'Português'),
        tile('b01b57a70c67310359e8c88197b9f4a7', 'Nuevo Tiempo', 'Español'),
        tile('1665be3f90d7999cb068ba7946955070', 'LLBN Latino', 'Español'),
        tile('136b9acb47d16154b7835bc9a7d5e19a', '3ABN Français', 'Français'),
        tile('42ed1061a9ed38d6e124007cc3c12fa8', '3ABN Russia Network', 'Русский'),
        tile('568800af03c6d40aac53d5a56abf64df', 'LLBN Arabic', 'العربية'),
        tile('341e48e88c70f0e21781d4f4b46230d7', 'LLBN Korean', '한국어'),
        tile('ecb38c2b5a360766adef64fb49bd5d7d', 'LLBN Chinese', '中文')
      ]
    };
  }
}
</script>
</body>
</html>
